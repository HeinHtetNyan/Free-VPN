# Explicit project name required — see backend/docker-compose.yml for why
# (several other apps on the target VPS also use a directory literally
# named "tunnel" for this).
name: sy-vpn-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: syvpn_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
