name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: hhn.infinity.appboxes.co
          port: 10026
          username: appbox
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          # VPS_DEPLOY_KEY is restricted server-side (authorized_keys forced
          # command) to only ever run deploy.sh, regardless of what's sent
          # here — this script value is unused but required by the action.
          script: /home/appbox/SY/deploy.sh
